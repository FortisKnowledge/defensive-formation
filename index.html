
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ドッジ配置ツール</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b27;
    --surface2: #1e2436;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --green: #00e676;
    --text: #e8eaf6;
    --text-dim: #5c6484;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
    min-height: 100vh;
    font-size: 35px;
  }

  /* ════════ カテゴリ選択画面 ════════ */
  #screen-select {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 36px;
    padding: 20px;
  }

  .select-logo {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--accent);
    text-align: center;
  }
  .select-sub {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 6px;
  }

  .cat-buttons { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 340px; }

  .cat-btn {
    padding: 20px 22px;
    border-radius: 14px;
    cursor: pointer;
    border: 1.5px solid #2a3048;
    background: var(--surface);
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .cat-btn.official { border-top: 3px solid var(--accent); }
  .cat-btn.junior   { border-top: 3px solid var(--green); }
  .cat-btn:active   { background: #1e2438; }

  .cat-btn .cat-name {
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    letter-spacing: 2px;
    margin-bottom: 5px;
  }
  .cat-btn.official .cat-name { color: var(--accent); }
  .cat-btn.junior   .cat-name { color: var(--green); }
  .cat-btn .cat-detail { font-size: 13px; color: var(--text-dim); }

  /* ════════ パターン選択画面 ════════ */
  #screen-patterns { display: none; }

  /* ════════ メイン（配置）画面 ════════ */
  #screen-main { display: none; }

  /* 共通ヘッダー */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #1f2535;
    gap: 8px;
  }

  .header-left { display: flex; flex-direction: column; gap: 3px; }

  header h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    line-height: 1;
  }

  .cat-badge {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 2px 8px;
    border-radius: 20px;
    display: inline-block;
    align-self: flex-start;
  }
  .cat-badge.official { background: rgba(0,212,255,0.15); color: var(--accent); }
  .cat-badge.junior   { background: rgba(0,230,118,0.15); color: var(--green); }

  .header-btns { display: flex; gap: 6px; flex-shrink: 0; }

  .hdr-btn {
    background: none;
    border: 1px solid #2a3048;
    color: var(--text-dim);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .hdr-btn.accent {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ════════ パターン一覧 ════════ */
  .page-title {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  .pattern-list { display: flex; flex-direction: column; gap: 10px; }

  .pattern-card {
    background: var(--surface);
    border: 1.5px solid #2a3048;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: background 0.12s, border-color 0.12s;
  }
  .pattern-card:active { background: #1e2438; }
  .pattern-card.has-data { border-color: #2a4055; }

  .pattern-num {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    color: var(--text-dim);
    width: 36px;
    text-align: center;
    flex-shrink: 0;
  }
  .pattern-card.has-data .pattern-num { color: var(--accent); }

  .pattern-info { flex: 1; min-width: 0; }

  .pattern-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .pattern-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .pattern-status {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(0,212,255,0.12);
    color: var(--accent);
  }
  .pattern-status.empty-status {
    background: rgba(255,255,255,0.05);
    color: var(--text-dim);
  }

  .pattern-preview {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pattern-arrow {
    font-size: 18px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  /* ════════ 配置エディタ ════════ */
  .section-title {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  #players-wrap { margin-bottom: 14px; }

  #players {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .card {
    padding: 10px 4px;
    border: 1px solid #1f2535;
    text-align: center;
    border-radius: var(--radius);
    font-size: 14px;
    background: var(--surface);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .card.selected {
    background: var(--accent);
    color: #0d1117;
    font-weight: 700;
    border-color: var(--accent);
    box-shadow: 0 0 14px rgba(0,212,255,0.4);
  }
  .card.used { opacity: 0.28; }

  .field-block {
    background: var(--surface);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #1f2535;
  }
  .field-block.infield-block  { border-top: 2.5px solid var(--accent); }
  .field-block.outfield-block { border-top: 2.5px solid var(--accent2); }

  #infield {
    display: grid;
    gap: 4px;
  }

  .slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 7px 2px;
    border-radius: 7px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.12s, border-color 0.12s;
    border: 1.5px dashed #2a3048;
    min-width: 0;
  }
  .slot .num {
    font-family: 'Oswald', sans-serif;
    font-size: 9px;
    color: var(--text-dim);
    line-height: 1;
    margin-bottom: 3px;
  }
  .slot .name {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
    word-break: break-all;
    max-width: 100%;
  }
  .slot.empty { background: #0a1520; border-color: #1a2535; }
  .slot.empty .name { color: #1e3048; font-size: 10px; font-weight: 400; }
  .slot.filled { background: #0a2030; border: 1.5px solid var(--accent); }
  .slot.filled .num  { color: var(--accent); }
  .slot.filled .name { color: var(--text); }

  #outfield { display: flex; }

  .slot-out {
    flex: 1;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 12px 14px;
    border: 1.5px dashed #3a2010;
    background: #1a0e08;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background 0.12s, border-color 0.12s;
  }
  .slot-out .num  { font-family: 'Oswald', sans-serif; font-size: 13px; color: var(--text-dim); flex-shrink: 0; }
  .slot-out .name { font-size: 16px; font-weight: 700; }
  .slot-out.filled { background: #2a1408; border: 1.5px solid var(--accent2); }
  .slot-out.filled .num { color: var(--accent2); }

  /* パターン名入力 */
  .pattern-name-edit-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid #2a3048;
    border-radius: 10px;
    padding: 8px 12px;
  }
  .pattern-name-edit-row label {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 1px;
  }
  .pattern-name-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 700;
  }

  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 10px;
  }
</style>
</head>
<body>

<!-- ── カテゴリ選択 ── -->
<div id="screen-select">
  <div>
    <div class="select-logo">⚡ DEFENCE SETUP</div>
    <div class="select-sub">DODGEBALL FORMATION TOOL</div>
  </div>
  <div class="cat-buttons">
    <div class="cat-btn official" onclick="selectCategory('official')">
      <div class="cat-name">OFFICIAL</div>
      <div class="cat-detail">オフィシャル 12人制　／　内野11 + 外野1</div>
    </div>
    <div class="cat-btn junior" onclick="selectCategory('junior')">
      <div class="cat-name">JUNIOR</div>
      <div class="cat-detail">ジュニア 8人制　／　内野7 + 外野1</div>
    </div>
  </div>
</div>

<!-- ── パターン選択 ── -->
<div id="screen-patterns">
  <header>
    <div class="header-left">
      <h1>⚡ DEFENCE SETUP</h1>
      <span id="pat-badge" class="cat-badge"></span>
    </div>
    <div class="header-btns">
      <button class="hdr-btn" onclick="goToSelect()">← 戻る</button>
    </div>
  </header>
  <div class="page-title">▸ フォーメーション選択</div>
  <div id="pattern-list" class="pattern-list"></div>
</div>

<!-- ── 配置エディタ ── -->
<div id="screen-main">
  <header>
    <div class="header-left">
      <h1>⚡ DEFENCE SETUP</h1>
      <span id="main-badge" class="cat-badge"></span>
    </div>
    <div class="header-btns">
      <button class="hdr-btn accent" onclick="savePattern()">保存</button>
      <button class="hdr-btn" onclick="resetAll()">リセット</button>
      <button class="hdr-btn" onclick="goToPatterns()">← 一覧</button>
    </div>
  </header>

  <div class="pattern-name-edit-row">
    <label>NAME</label>
    <input id="pattern-name-input" class="pattern-name-input" type="text" placeholder="フォーメーション名を入力" maxlength="20" />
  </div>

  <div id="players-wrap">
    <div class="section-title">▸ Players</div>
    <div id="players"></div>
  </div>

  <div class="field-block infield-block">
    <div id="infield-title" class="section-title"></div>
    <div id="infield"></div>
  </div>

  <div class="field-block outfield-block">
    <div class="section-title">▸ Outfield — 外野 1</div>
    <div id="outfield"></div>
  </div>

  <div class="hint">名前を選んでスロットをタップ　／　スロット同士でも入れ替え可</div>
</div>

<script>
const players = [
  "ひろやす","りょうが","ひびき","ゆうき","みなと","ゆうた",
  "ふじひな","ふうと","たつや","かいち","ひなた","あきひと",
  "もとき","たつき","かい","まお"
].map((name, i) => ({ id: i, name }));

const CATEGORIES = {
  official: { label: "OFFICIAL", infield: 11, total: 12, storageKey: "df_official" },
  junior:   { label: "JUNIOR",   infield: 7,  total: 8,  storageKey: "df_junior"   }
};

const NUM_PATTERNS = 5;

let currentCat = null;
let currentPatternIdx = null;
let slots = [];
let selectedId = null;

/* ── ストレージ ── */
function loadAllPatterns(cat) {
  const raw = localStorage.getItem(CATEGORIES[cat].storageKey);
  if (raw) return JSON.parse(raw);
  // 初期化：5パターン空
  return Array.from({ length: NUM_PATTERNS }, (_, i) => ({
    name: `パターン ${i + 1}`,
    slots: Array(CATEGORIES[cat].total).fill(null)
  }));
}

function saveAllPatterns(cat, patterns) {
  localStorage.setItem(CATEGORIES[cat].storageKey, JSON.stringify(patterns));
}

/* ── 画面遷移 ── */
function show(id) {
  ["screen-select","screen-patterns","screen-main"].forEach(s => {
    document.getElementById(s).style.display = "none";
  });
  document.getElementById(id).style.display = (id === "screen-select") ? "flex" : "block";
}

function goToSelect() { show("screen-select"); }

function selectCategory(cat) {
  currentCat = cat;
  show("screen-patterns");
  renderPatternList();
}

function goToPatterns() {
  show("screen-patterns");
  renderPatternList();
}

function openPattern(idx) {
  currentPatternIdx = idx;
  const cfg = CATEGORIES[currentCat];
  const patterns = loadAllPatterns(currentCat);
  const pat = patterns[idx];

  slots = pat.slots.slice();
  selectedId = null;

  // バッジ
  const badge = document.getElementById("main-badge");
  badge.textContent = cfg.label;
  badge.className = "cat-badge " + currentCat;

  // パターン名
  document.getElementById("pattern-name-input").value = pat.name;

  // 内野タイトル・グリッド
  document.getElementById("infield-title").textContent = `▸ Infield — 内野 ${cfg.infield}`;
  document.getElementById("infield").style.gridTemplateColumns = `repeat(${cfg.infield}, 1fr)`;

  show("screen-main");
  render();
}

/* ── パターン一覧 描画 ── */
function renderPatternList() {
  const cfg = CATEGORIES[currentCat];
  const badge = document.getElementById("pat-badge");
  badge.textContent = cfg.label;
  badge.className = "cat-badge " + currentCat;

  const patterns = loadAllPatterns(currentCat);
  const listDiv = document.getElementById("pattern-list");
  listDiv.innerHTML = "";

  patterns.forEach((pat, i) => {
    const filled = pat.slots.filter(s => s !== null).length;
    const hasData = filled > 0;

    const card = document.createElement("div");
    card.className = "pattern-card" + (hasData ? " has-data" : "");
    card.onclick = () => openPattern(i);

    // 番号
    const numEl = document.createElement("div");
    numEl.className = "pattern-num";
    numEl.textContent = i + 1;

    // 情報
    const info = document.createElement("div");
    info.className = "pattern-info";

    const nameRow = document.createElement("div");
    nameRow.className = "pattern-name-row";

    const nameEl = document.createElement("span");
    nameEl.className = "pattern-label";
    nameEl.textContent = pat.name || `パターン ${i + 1}`;

    const statusEl = document.createElement("span");
    statusEl.className = "pattern-status" + (hasData ? "" : " empty-status");
    statusEl.textContent = hasData ? `${filled}人配置済み` : "未設定";

    nameRow.appendChild(nameEl);
    nameRow.appendChild(statusEl);

    // プレビュー（配置済みの名前を横並び）
    const preview = document.createElement("div");
    preview.className = "pattern-preview";
    if (hasData) {
      const names = pat.slots
        .map(pid => pid !== null ? players.find(p => p.id === pid)?.name : null)
        .filter(Boolean);
      preview.textContent = names.join("　");
    } else {
      preview.textContent = "タップして編集";
    }

    info.appendChild(nameRow);
    info.appendChild(preview);

    const arrow = document.createElement("div");
    arrow.className = "pattern-arrow";
    arrow.textContent = "›";

    card.appendChild(numEl);
    card.appendChild(info);
    card.appendChild(arrow);
    listDiv.appendChild(card);
  });
}

/* ── 保存 ── */
function savePattern() {
  const patterns = loadAllPatterns(currentCat);
  const nameVal = document.getElementById("pattern-name-input").value.trim();
  patterns[currentPatternIdx] = {
    name: nameVal || `パターン ${currentPatternIdx + 1}`,
    slots: slots.slice()
  };
  saveAllPatterns(currentCat, patterns);

  // ボタンを一瞬フラッシュ
  const btn = document.querySelector(".hdr-btn.accent");
  const orig = btn.textContent;
  btn.textContent = "✓ 保存済み";
  btn.style.color = "var(--green)";
  btn.style.borderColor = "var(--green)";
  setTimeout(() => {
    btn.textContent = orig;
    btn.style.color = "";
    btn.style.borderColor = "";
  }, 1200);
}

function resetAll() {
  if (!confirm("このパターンの配置をリセットしますか？")) return;
  slots = Array(CATEGORIES[currentCat].total).fill(null);
  selectedId = null;
  render();
}

/* ── 配置操作 ── */
function selectPlayer(id) {
  selectedId = (selectedId === id) ? null : id;
  render();
}

function clickSlot(i) {
  if (selectedId === null) {
    slots[i] = null;
  } else {
    const from   = slots.indexOf(selectedId);
    const target = slots[i];
    if (target === null) {
      if (from !== -1) slots[from] = null;
      slots[i] = selectedId;
    } else if (target !== selectedId) {
      if (from !== -1) slots[from] = target;
      slots[i] = selectedId;
    }
  }
  selectedId = null;
  render();
}

/* ── 配置エディタ 描画 ── */
function render() {
  const cfg = CATEGORIES[currentCat];
  const playersDiv  = document.getElementById("players");
  const infieldDiv  = document.getElementById("infield");
  const outfieldDiv = document.getElementById("outfield");
  playersDiv.innerHTML = infieldDiv.innerHTML = outfieldDiv.innerHTML = "";

  players.forEach(p => {
    const div = document.createElement("div");
    div.className = "card"
      + (p.id === selectedId   ? " selected" : "")
      + (slots.includes(p.id) ? " used"     : "");
    div.textContent = p.name;
    div.onclick = () => selectPlayer(p.id);
    playersDiv.appendChild(div);
  });

  for (let i = 0; i < cfg.infield; i++) {
    const pid = slots[i];
    const p   = players.find(x => x.id === pid);
    const div = document.createElement("div");
    div.className = "slot " + (p ? "filled" : "empty");

    const numEl  = document.createElement("div"); numEl.className = "num";  numEl.textContent = i + 1;
    const nameEl = document.createElement("div"); nameEl.className = "name"; nameEl.textContent = p ? p.name : "－";

    div.appendChild(numEl); div.appendChild(nameEl);
    div.onclick = () => clickSlot(i);
    infieldDiv.appendChild(div);
  }

  const outIdx = cfg.infield;
  const pid = slots[outIdx];
  const p   = players.find(x => x.id === pid);
  const out = document.createElement("div");
  out.className = "slot-out" + (p ? " filled" : "");

  const numEl  = document.createElement("div"); numEl.className = "num";  numEl.textContent = "外野";
  const nameEl = document.createElement("div"); nameEl.className = "name"; nameEl.textContent = p ? p.name : "未配置";

  out.appendChild(numEl); out.appendChild(nameEl);
  out.onclick = () => clickSlot(outIdx);
  outfieldDiv.appendChild(out);
}
</script>
</body>
</html>
